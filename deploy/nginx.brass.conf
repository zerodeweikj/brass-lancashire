# Brass: Lancashire —— nginx 反代（无域名 / 纯 IP HTTP 模式）
# 用法：on_vps_setup.sh 会自动 cp 到 /etc/nginx/conf.d/brass.conf 并 reload。
server {
    listen 80 default_server;
    server_name 47.76.136.173;

    client_max_body_size 8m;

    # 长轮询 / 普通 API：反代到本地 uvicorn
    location /api/ {
        include /etc/nginx/conf.d/csp.conf;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长轮询（since+wait）不要过早断；给足超时
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 静态前端（web/dist 由 uvicorn 同源托管，nginx 反代即可）
    location /assets/ {
        include /etc/nginx/conf.d/csp.conf;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        include /etc/nginx/conf.d/csp.conf;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
