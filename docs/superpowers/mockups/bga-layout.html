<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brass Lancashire - BGA Layout Mockup (hand in board upper-left)</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel-bg: #161b22;
      --panel-border: #30363d;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --muted: #8b949e;
      --red: #da3633;
      --white: #e6edf3;
      --yellow: #d29922;
      --purple: #8957e5;
      --top-height: 56px;
      --right-width: 320px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }

    /* 顶部行动栏 */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--top-height);
      background: linear-gradient(180deg, #1c2128, #161b22);
      border-bottom: 1px solid var(--panel-border);
      display: flex; align-items: center; gap: 10px; padding: 0 16px; z-index: 100;
    }
    .topbar .logo { font-weight: 700; color: var(--accent); margin-right: 12px; font-size: 15px; }
    .topbar .turn-info { color: var(--muted); font-size: 13px; margin-right: auto; }
    .btn {
      height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--panel-border);
      background: #21262d; color: var(--text); font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: .15s;
    }
    .btn:hover { background: #30363d; border-color: #8b949e; }
    .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .btn.primary:hover { background: #388bfd; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; }

    /* 中间版图 */
    .board-area {
      position: fixed; top: var(--top-height); left: 0; right: var(--right-width); bottom: 0;
      background: #0a3d25;
      background-image:
        radial-gradient(circle at 35% 45%, rgba(255,255,255,.06) 0 120px, transparent 121px),
        radial-gradient(circle at 70% 65%, rgba(255,255,255,.05) 0 90px, transparent 91px);
    }
    .board-label {
      position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
      font-size: 42px; color: rgba(255,255,255,.12); font-weight: 800; pointer-events: none;
    }
    .board-hint {
      position: absolute; bottom: 12px; left: 12px; color: rgba(255,255,255,.45); font-size: 12px;
    }

    /* 手牌区：嵌入版图左上角，横排面板 */
    .hand-panel {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      background: rgba(22,27,34,.92); border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 8px 10px; max-width: calc(100% - 24px); backdrop-filter: blur(2px);
    }
    .hand-panel .hand-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .hand-panel .hand-title strong { color: var(--text); }
    .hand-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .card {
      width: 84px; height: 116px; border-radius: 7px; background: #f4f1e9; color: #1a1a1a;
      font-size: 11px; padding: 6px; cursor: pointer; transition: transform .12s, box-shadow .12s;
      box-shadow: 0 3px 8px rgba(0,0,0,.3); flex: 0 0 auto;
      display: flex; flex-direction: column; justify-content: space-between; border: 2px solid transparent;
    }
    .card:hover { transform: translateY(-8px); box-shadow: 0 8px 16px rgba(0,0,0,.4); }
    .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .card .title { font-weight: 700; }
    .card .type { color: #555; font-size: 10px; }

    /* 右侧玩家面板列 */
    .right-col {
      position: fixed; top: var(--top-height); right: 0; width: var(--right-width); bottom: 0;
      background: var(--panel-bg); border-left: 1px solid var(--panel-border);
      display: flex; flex-direction: column; overflow-y: auto; z-index: 90;
    }
    .player-panel {
      flex: 1; min-height: 150px; border-bottom: 1px solid var(--panel-border);
      display: flex; flex-direction: column; padding: 10px; position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,.02), transparent);
    }
    .player-panel.active { box-shadow: inset 0 0 0 2px var(--accent); }
    .panel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
    }
    .avatar.red { border-color: var(--red); color: var(--red); }
    .avatar.white { border-color: var(--white); color: var(--white); }
    .avatar.yellow { border-color: var(--yellow); color: var(--yellow); }
    .avatar.purple { border-color: var(--purple); color: var(--purple); }
    .name { font-size: 14px; font-weight: 600; }
    .money { margin-left: auto; font-size: 13px; color: var(--muted); }
    .mat {
      flex: 1; background: #1c2128; border-radius: 6px; border: 1px solid var(--panel-border);
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .mat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; padding: 8px; }
    .tile {
      aspect-ratio: 1; border-radius: 4px; border: 1px solid rgba(255,255,255,.15);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; color: rgba(255,255,255,.7); cursor: help; position: relative;
    }
    .tile.cotton { background: #2d5a27; }
    .tile.port { background: #1f4e79; }
    .tile.shipyard { background: #5a3d18; }
    .tile.iron { background: #5c2b2b; }
    .tile.coal { background: #2f2f2f; }
    .tile .count { font-size: 16px; font-weight: 700; color: #fff; }
    .tile.empty { background: transparent; border-style: dashed; opacity: .35; cursor: default; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">工业革命·兰开夏</div>
    <div class="turn-info">回合 3 ·  canal 时期 · 当前玩家：红方</div>
    <button class="btn primary"><span class="dot"></span>建造产业</button>
    <button class="btn">建造连接</button>
    <button class="btn">双手牌建造</button>
    <button class="btn">售卖棉花</button>
    <button class="btn">发展</button>
    <button class="btn">贷款</button>
    <button class="btn">跳过</button>
  </div>

  <div class="board-area">
    <!-- 手牌区：嵌入版图左上角 -->
    <div class="hand-panel">
      <div class="hand-title"><strong>手牌 (8)</strong></div>
      <div class="hand-row">
        <div class="card"><div class="title">伯明翰</div><div class="type">城市牌</div></div>
        <div class="card"><div class="title">利物浦</div><div class="type">城市牌</div></div>
        <div class="card"><div class="title">棉花厂</div><div class="type">产业牌</div></div>
        <div class="card"><div class="title">煤炭厂</div><div class="type">产业牌</div></div>
        <div class="card"><div class="title">铁工厂</div><div class="type">产业牌</div></div>
        <div class="card"><div class="title">造船厂</div><div class="type">产业牌</div></div>
        <div class="card"><div class="title">港口</div><div class="type">产业牌</div></div>
        <div class="card"><div class="title">曼彻斯特</div><div class="type">城市牌</div></div>
      </div>
    </div>
    <div class="board-label">GAME BOARD</div>
    <div class="board-hint">WASD / 方向键移动 · 滚轮缩放 · 拖拽平移</div>
  </div>

  <div class="right-col">
    <div class="player-panel active">
      <div class="panel-header">
        <div class="avatar red">红</div>
        <div class="name">红方</div>
        <div class="money">£ 17 · 收入 10</div>
      </div>
      <div class="mat">
        <div class="mat-grid">
          <div class="tile cotton"><span class="count">12</span><span>棉</span></div>
          <div class="tile port"><span class="count">8</span><span>港</span></div>
          <div class="tile shipyard"><span class="count">6</span><span>船</span></div>
          <div class="tile iron"><span class="count">4</span><span>铁</span></div>
          <div class="tile coal"><span class="count">7</span><span>煤</span></div>
        </div>
      </div>
    </div>
    <div class="player-panel">
      <div class="panel-header">
        <div class="avatar white">白</div>
        <div class="name">白方</div>
        <div class="money">£ 12 · 收入 7</div>
      </div>
      <div class="mat">
        <div class="mat-grid">
          <div class="tile cotton"><span class="count">10</span><span>棉</span></div>
          <div class="tile port"><span class="count">8</span><span>港</span></div>
          <div class="tile shipyard"><span class="count">5</span><span>船</span></div>
          <div class="tile iron empty"><span class="count">0</span><span>铁</span></div>
          <div class="tile coal"><span class="count">6</span><span>煤</span></div>
        </div>
      </div>
    </div>
    <div class="player-panel">
      <div class="panel-header">
        <div class="avatar yellow">黄</div>
        <div class="name">黄方</div>
        <div class="money">£ 21 · 收入 12</div>
      </div>
      <div class="mat">
        <div class="mat-grid">
          <div class="tile cotton"><span class="count">11</span><span>棉</span></div>
          <div class="tile port"><span class="count">7</span><span>港</span></div>
          <div class="tile shipyard"><span class="count">6</span><span>船</span></div>
          <div class="tile iron"><span class="count">4</span><span>铁</span></div>
          <div class="tile coal"><span class="count">5</span><span>煤</span></div>
        </div>
      </div>
    </div>
    <div class="player-panel">
      <div class="panel-header">
        <div class="avatar purple">紫</div>
        <div class="name">紫方</div>
        <div class="money">£ 9 · 收入 5</div>
      </div>
      <div class="mat">
        <div class="mat-grid">
          <div class="tile cotton"><span class="count">9</span><span>棉</span></div>
          <div class="tile port"><span class="count">8</span><span>港</span></div>
          <div class="tile shipyard"><span class="count">4</span><span>船</span></div>
          <div class="tile iron"><span class="count">3</span><span>铁</span></div>
          <div class="tile coal"><span class="count">7</span><span>煤</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
